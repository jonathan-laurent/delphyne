- input:
    request:
      chat:
        - role: system
          content: |-
            I am executing a program that contains nondeterministic assignments along with assertions (e.g., in the form of `ensure` and `fail` statements). I am stuck at one of these nondeterministic assignments and your goal is to generate an assigned value, in such a way that the program can go on and not fail any assertion.

            More specifically, I'll give you three pieces of information:

            - A nondeterministic program.
            - The name of the variable that is being assigned at the program location where I am currently stuck.
            - Some values for a number of local variables.

            Your job is to generate a correct value to assign. The expected type of this value is indicated inside the nondeterministic assignment operator.

            Terminate your answer with a code block (delimited by triple backquotes) that contains a YAML object of the requested type. Do not wrap this YAML value into an object with a field named like the assigned variable.
        - role: user
          content: |-
            Program:

            ```
            @dp.strategy
            def audit_model_name(name: str) -> Strategy[Branch | Fail, IPDict, Finding]:
                """
                Compare what `pricing="auto"` does to `name` with what it should do.
                """
                resolved = _pricing_key(name)
                if name in PRICING:
                    # Nothing to audit: an exactly listed name is priced by its own
                    # entry. Never spend an oracle call on a decidable question.
                    return Finding(
                        model_name=name,
                        resolved_as=resolved,
                        priced_like=name,
                        verdict="agrees",
                        suggested_entry=None,
                        justification="Listed in the pricing table.",
                    )
                assessment = yield from dp.guess(Assessment, using=[name, PRICING])
                yield from dp.ensure(
                    assessment.priced_like is None or assessment.priced_like in PRICING,
                    "unlisted_reference",
                    message="`priced_like` must name a model from the table.",
                )
                yield from dp.ensure(
                    assessment.released or assessment.priced_like is None,
                    "unreleased_but_priced",
                )
                if resolved == assessment.priced_like:
                    verdict = "agrees"
                elif resolved is None:
                    verdict = "missing_entry"
                elif assessment.priced_like is None:
                    verdict = "unconfirmed"
                else:
                    verdict = "mispriced"
                if verdict != "missing_entry":
                    return Finding(
                        model_name=name,
                        resolved_as=resolved,
                        priced_like=assessment.priced_like,
                        verdict=verdict,
                        suggested_entry=None,
                        justification=assessment.justification,
                    )
                # The rule refuses a name whose rates are known. Ask which entry
                # would close the gap, then check the answer by running the rule.
                entry = yield from dp.guess(str, using=[name, assessment.priced_like])
                yield from dp.ensure(entry not in PRICING, "already_listed")
                yield from dp.ensure(
                    _resolves_with(name, entry),
                    "entry_does_not_apply",
                    message=f"Adding {entry} would not make {name} resolve to it.",
                )
                return Finding(
                    model_name=name,
                    resolved_as=None,
                    priced_like=assessment.priced_like,
                    verdict="missing_entry",
                    suggested_entry=entry,
                    justification=assessment.justification,
                )
            ```

